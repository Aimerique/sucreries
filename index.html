<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Le Royaume des Sucreries</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #7cc8ff;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: "Chalkboard SE", "Comic Sans MS", "Marker Felt", "Trebuchet MS", sans-serif; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 2vh; padding: 16px; box-sizing: border-box; text-align: center; z-index: 5; }
  .screen.show { display: flex; }
  h1 { margin: 0; font-size: clamp(30px, 7vw, 72px); color: #ff4fa3; line-height: 1.05;
    text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 6px 12px rgba(0,0,0,.2); }
  .players { display: flex; gap: 4vw; flex-wrap: wrap; justify-content: center; }
  .player { border: 6px solid #fff; border-radius: 32px; padding: 14px 22px 18px; cursor: pointer;
    box-shadow: 0 10px 0 rgba(0,0,0,.15); min-width: 170px; color: #fff; font: inherit;
    font-size: clamp(24px, 4.5vw, 40px); font-weight: bold; transition: transform .1s; }
  .player:active { transform: scale(.95); }
  .player img { height: clamp(110px, 22vh, 200px); display: block; margin: 0 auto 6px; pointer-events: none; }
  .player .best { font-size: .6em; display: block; margin-top: 6px; opacity: .95; }
  .p1 { background: #ff7ab8; }
  .p2 { background: #5aa9ff; }
  .card { background: rgba(255,255,255,.92); border-radius: 36px; padding: 24px 32px;
    box-shadow: 0 12px 0 rgba(0,0,0,.12); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .big { font-size: clamp(60px, 14vw, 120px); font-weight: bold; color: #ff9f1a; line-height: 1;
    text-shadow: 3px 3px 0 #fff; }
  .stars { font-size: clamp(30px, 7vw, 56px); letter-spacing: 6px; }
  .bestline { font-size: clamp(18px, 3.5vw, 28px); color: #7a4ccf; font-weight: bold; }
  .btn { border: 6px solid #fff; border-radius: 999px; background: #3ccf6e; color: #fff;
    font: inherit; font-size: clamp(26px, 5vw, 44px); font-weight: bold; padding: 14px 40px;
    box-shadow: 0 10px 0 #23964b; cursor: pointer; display: inline-flex; align-items: center; gap: 12px; }
  .btn:active { transform: translateY(6px); box-shadow: 0 4px 0 #23964b; }
  .btn.home { background: #ffb02e; box-shadow: 0 8px 0 #d68400; font-size: clamp(20px, 4vw, 32px); padding: 10px 26px; }
  .btn svg { width: 1.2em; height: 1.2em; }
  #pauseBtn { position: fixed; z-index: 4; right: 12px; bottom: 12px; width: 56px; height: 56px;
    border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,.35); display: none;
    align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  #pauseBtn.show { display: flex; }
  #pauseBtn svg { width: 26px; height: 26px; }
  .hint { color: #fff; font-size: clamp(16px, 3vw, 22px); text-shadow: 0 2px 4px rgba(0,0,0,.3); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Écran d'accueil : choisir son joueur -->
<div id="menu" class="screen show">
  <h1>Le Royaume<br>des Sucreries</h1>
  <div class="players">
    <button class="player p1" data-p="0"><img class="heroImg" alt=""><span class="pname"></span><span class="best"></span></button>
    <button class="player p2" data-p="1"><img class="heroImg" alt=""><span class="pname"></span><span class="best"></span></button>
  </div>
</div>

<!-- Pause -->
<div id="pause" class="screen">
  <div class="card">
    <button class="btn" id="resumeBtn"><svg viewBox="0 0 24 24"><path fill="#fff" d="M7 4v16l13-8z"/></svg></button>
    <button class="btn home" id="quitBtn"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button>
  </div>
</div>

<!-- Fin de partie (gentille) -->
<div id="over" class="screen">
  <div class="card">
    <div class="stars" id="overStars">⭐</div>
    <div class="bestline" id="overName"></div>
    <div class="big" id="overScore">0</div>
    <div class="bestline" id="overBest"></div>
    <button class="btn" id="againBtn"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 4V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg>Rejouer</button>
    <button class="btn home" id="homeBtn"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button>
  </div>
</div>

<button id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24"><path fill="#fff" d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></button>

function getBest(p) { try { return parseInt(localStorage.getItem("sucreries_best_" + p) || "0", 10) || 0; } catch (e) { return memBest[p] || 0; } }
function setBest(p, v) { memBest[p] = v; try { localStorage.setItem("sucreries_best_" + p, String(v)); } catch (e) {} }

function refreshMenu() {
  document.querySelectorAll(".player").forEach(b => {
    const p = +b.dataset.p;
    b.querySelector(".pname").textContent = PRENOMS[p];
    const best = getBest(p);
    b.querySelector(".best").textContent = best > 0 ? "🏆 " + best : "";
  });
}

// ---------- Sons (Web Audio) ----------
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, start, dur, type = "sine", vol = 0.25, freqEnd = null) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + start;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  ding()  { tone(1318, 0, 0.18, "sine", 0.22); tone(1976, 0.06, 0.25, "sine", 0.18); },
  magic() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * 0.06, 0.3, "triangle", 0.16)); },
  bouh()  { tone(330, 0, 0.45, "sawtooth", 0.12, 110); tone(250, 0.05, 0.5, "square", 0.06, 90); },
  boing() { tone(200, 0, 0.25, "sine", 0.25, 700); },
  end()   { [784, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.15, 0.3, "triangle", 0.18)); },
  click() { tone(880, 0, 0.08, "sine", 0.15); },
};

// ---------- Décor ----------
let clouds = [];
function makeClouds() {
  clouds = [];
  for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: H * (0.06 + Math.random() * 0.5), s: 0.6 + Math.random() * 0.8, v: 8 + Math.random() * 14 });
}
function drawCloud(x, y, s) {
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  const r = 34 * s * U;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.arc(x + r * 1.1, y - r * 0.45, r * 1.15, 0, Math.PI * 2);
  ctx.arc(x + r * 2.3, y, r * 0.95, 0, Math.PI * 2);
  ctx.arc(x + r * 1.2, y + r * 0.35, r, 0, Math.PI * 2);
  ctx.fill();
}
function drawBackground(dt) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#5fb8ff"); g.addColorStop(0.7, "#bfe6ff"); g.addColorStop(1, "#ffe3f3");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // soleil
  ctx.fillStyle = "#ffe066";
  ctx.beginPath(); ctx.arc(W - 80 * U, 150 * U, 40 * U, 0, Math.PI * 2); ctx.fill();
  clouds.forEach(c => {
    c.x += c.v * dt * U;
    if (c.x > W + 40) c.x = -140 * c.s * U;
    drawCloud(c.x, c.y, c.s);
  });
  // collines en bonbon
  ctx.fillStyle = "#9be38a";
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, H - 30 * U - Math.sin(x / (90 * U)) * 12 * U);
  ctx.lineTo(W, H); ctx.fill();
}

// ---------- Jeu ----------
const S = {
  running: false, paused: false, player: 0,
  score: 0, lives: VIES, time: 0, spawnT: 0,
  items: [], parts: [], texts: [],
  powers: {}, // nom -> secondes restantes
  hero: { x: 0, tx: 0, hurt: 0, scale: 1 },
  shake: 0,
};
const keys = { left: false, right: false };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(W, H * 0.9) / 600; // unité : 1 sur un écran de ~600 px
  U = Math.max(0.6, Math.min(U, 1.6));
  if (!clouds.length) makeClouds();
  S.hero.x = Math.min(Math.max(S.hero.x || W / 2, 0), W);
  S.hero.tx = S.hero.x;
}
window.addEventListener("resize", resize);
resize();
makeClouds();

function heroH() { return 150 * U * S.hero.scale; }
function heroW() { const im = IMG.heroine; return heroH() * (im.naturalWidth / im.naturalHeight || 0.9); }
function heroY() { return H - 22 * U; } // pieds

function itemSize(kind) { return (kind === "carotte" ? 92 : 76) * U; }

function pickKind() {
  const tot = CHANCES.piece_or + CHANCES.piece_noire + CHANCES.carotte + CHANCES.bonbon;
  let r = Math.random() * tot;
  if ((r -= CHANCES.piece_or) < 0) return "piece_or";
  if ((r -= CHANCES.piece_noire) < 0) return "piece_noire";
  if ((r -= CHANCES.carotte) < 0) {
    // pas de carotte pendant les toutes premières secondes
    return S.time < 4 ? "piece_or" : "carotte";
  }
  return BONBONS[Math.floor(Math.random() * BONBONS.length)];
}

function spawn() {
  const kind = pickKind();
  const size = itemSize(kind);
  const margin = size * 0.6;
  S.items.push({
    kind, size,
    x: margin + Math.random() * (W - margin * 2),
    y: -size,
    rot: (Math.random() - 0.5) * 0.6,
    vr: (Math.random() - 0.5) * 1.5,
    wob: Math.random() * 6,
    bounced: false, vx: 0, vy: 0,
  });
}

function baseSpeed() {
  return Math.min(VITESSE_DEPART + S.time * ACCELERATION, VITESSE_MAX) * (H / 800);
}
function slowFactor() { return S.powers.ralenti > 0 ? 0.4 : 1; }

function startGame(p) {
  audio();
  S.player = p; S.running = true; S.paused = false;
  S.score = 0; S.lives = VIES; S.time = 0; S.spawnT = 0.5;
  S.items = []; S.parts = []; S.texts = []; S.powers = {};
  S.hero.x = S.hero.tx = W / 2; S.hero.hurt = 0; S.hero.scale = 1;
  show(null);
  document.getElementById("pauseBtn").classList.add("show");
}

function endGame() {
  S.running = false;
  document.getElementById("pauseBtn").classList.remove("show");
  sfx.end();
  const best = getBest(S.player);
  const record = S.score > best;
  if (record) setBest(S.player, S.score);
  document.getElementById("overName").textContent = "Bravo " + PRENOMS[S.player] + " !";
  document.getElementById("overScore").textContent = S.score;
  const nb = S.score >= 60 ? 3 : S.score >= 25 ? 2 : 1;
  document.getElementById("overStars").textContent = (record && S.score > 0 ? "🏆 " : "") + "⭐".repeat(nb);
  document.getElementById("overBest").textContent = "🏆 " + Math.max(best, S.score);
  setTimeout(() => show("over"), 500);
}

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("show", s.id === id));
}

function burst(x, y, color, n = 14, speed = 260) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random() * 0.7) * speed * U;
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80 * U, life: 0.7 + Math.random() * 0.4, t: 0, color, r: (3 + Math.random() * 5) * U, star: Math.random() < 0.4 });
  }
}
function floatText(x, y, txt, color) { S.texts.push({ x, y, txt, color, t: 0 }); }

function catchItem(it) {
  const hx = S.hero.x, hy = heroY() - heroH() * 0.55;
  if (it.kind === "carotte") {
    if (S.powers.bouclier > 0) {
      sfx.boing();
      it.bounced = true; it.vy = -500 * U; it.vx = (it.x < hx ? -1 : 1) * 300 * U;
      burst(it.x, it.y, "#ff8fd0", 10);
      return false; // l'objet continue (rebondit)
    }
    S.lives--; sfx.bouh();
    S.hero.hurt = 1; S.shake = 0.35;
    burst(it.x, it.y, "#ff7a00", 12);
    floatText(hx, hy - 30 * U, "💔", "#e33");
    if (S.lives <= 0) endGame();
    return true;
  }
  if (POINTS_PIECE[it.kind] !== undefined) {
    const mult = S.powers.double > 0 ? 2 : 1;
    const pts = POINTS_PIECE[it.kind] * mult;
    S.score += pts; sfx.ding();
    burst(it.x, it.y, it.kind === "piece_or" ? "#ffb300" : "#666", 10, 200);
    floatText(it.x, it.y - 20 * U, "+" + pts, mult > 1 ? "#ffb300" : "#fff");
    return true;
  }
  // bonbon → pouvoir
  const pw = POUVOIRS[it.kind];
  if (pw && POWER_INFO[pw]) {
    S.powers[pw] = DUREE_POUVOIR;
    sfx.magic();
    burst(it.x, it.y, POWER_INFO[pw].color, 26, 360);
    S.flash = { color: POWER_INFO[pw].color, t: 0.5 };
  }
  return true;
}

function update(dt) {
  S.time += dt;
  // pouvoirs
  for (const k in S.powers) { S.powers[k] -= dt; if (S.powers[k] <= 0) delete S.powers[k]; }
  const targetScale = S.powers.geante > 0 ? 1.8 : 1;
  S.hero.scale += (targetScale - S.hero.scale) * Math.min(1, dt * 6);

  // déplacement héroïne
  const kspeed = 900 * U;
  if (keys.left) S.hero.tx -= kspeed * dt;
  if (keys.right) S.hero.tx += kspeed * dt;
  const half = heroW() * 0.42;
  S.hero.tx = Math.max(half, Math.min(W - half, S.hero.tx));
  S.hero.x += (S.hero.tx - S.hero.x) * Math.min(1, dt * 16);
  S.hero.hurt = Math.max(0, S.hero.hurt - dt * 1.5);
  S.shake = Math.max(0, S.shake - dt);

  // apparitions : plus fréquentes avec le temps
  S.spawnT -= dt * slowFactor();
  if (S.spawnT <= 0) {
    spawn();
    const interval = Math.max(0.45, 1.25 - S.time * 0.01);
    S.spawnT = interval * (0.7 + Math.random() * 0.6);
  }

  // objets
  const sp = baseSpeed() * slowFactor();
  const hw = heroW(), hh = heroH();
  const hx = S.hero.x, hTop = heroY() - hh, hBot = heroY();
  const catchL = hx - hw * 0.42, catchR = hx + hw * 0.42;
  const catchTop = hTop + hh * 0.05, catchBot = hBot - hh * 0.15;
  for (let i = S.items.length - 1; i >= 0; i--) {
    const it = S.items[i];
    if (it.bounced) {
      it.vy += 1400 * U * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.rot += 8 * dt;
      if (it.y > H + 200 || it.x < -200 || it.x > W + 200) S.items.splice(i, 1);
      continue;
    }
    it.y += sp * dt;
    it.wob += dt * 3;
    it.rot += it.vr * dt * 0.5;
    // aimant : les pièces viennent vers l'héroïne
    if (S.powers.aimant > 0 && POINTS_PIECE[it.kind] !== undefined) {
      const dx = hx - it.x, dy = (hTop + hh * 0.4) - it.y;
      const d = Math.hypot(dx, dy) || 1;
      if (it.y > H * 0.15) {
        const pull = 900 * U * dt;
        it.x += dx / d * pull; it.y += dy / d * pull * 0.6;
      }
    }
    const r = it.size * 0.38;
    if (it.x + r > catchL && it.x - r < catchR && it.y + r > catchTop && it.y - r < catchBot) {
      if (catchItem(it)) S.items.splice(i, 1);
      if (!S.running) return;
      continue;
    }
    if (it.y - it.size > H) S.items.splice(i, 1);
  }

  // particules
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const p = S.parts[i]; p.t += dt;
    p.vy += 500 * U * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t > p.life) S.parts.splice(i, 1);
  }
  for (let i = S.texts.length - 1; i >= 0; i--) {
    const t = S.texts[i]; t.t += dt; t.y -= 60 * U * dt;
    if (t.t > 1) S.texts.splice(i, 1);
  }
  if (S.flash) { S.flash.t -= dt; if (S.flash.t <= 0) S.flash = null; }
}

function drawImg(im, x, y, h, rot = 0, alpha = 1) {
  if (!im.naturalWidth) return;
  const w = h * im.naturalWidth / im.naturalHeight;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}

function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}

function heart(x, y, s, full) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.bezierCurveTo(-14, -4, -8, -16, 0, -8);
  ctx.bezierCurveTo(8, -16, 14, -4, 0, 6);
  ctx.fillStyle = full ? "#ff3b6b" : "rgba(255,255,255,.55)";
  ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
  ctx.restore();
}

function drawHero(t) {
  const hh = heroH(), x = S.hero.x, yc = heroY() - hh / 2;
  const P = S.powers;
  // aura des pouvoirs
  if (P.double > 0) {
    ctx.save(); ctx.globalAlpha = 0.35 + 0.15 * Math.sin(t * 8);
    const g = ctx.createRadialGradient(x, yc, 10, x, yc, hh * 0.75);
    g.addColorStop(0, "#fff6a0"); g.addColorStop(1, "rgba(255,200,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, yc, hh * 0.75, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  if (P.aimant > 0) {
    ctx.save(); ctx.strokeStyle = "#3ccf6e"; ctx.lineWidth = 4 * U;
    for (let k = 0; k < 3; k++) {
      const ph = ((t * 1.2 + k / 3) % 1);
      ctx.globalAlpha = 1 - ph;
      ctx.beginPath(); ctx.arc(x, yc, hh * (0.3 + ph * 0.9), 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
  // ombre au sol
  ctx.fillStyle = "rgba(0,0,0,.15)";
  ctx.beginPath(); ctx.ellipse(x, heroY(), heroW() * 0.35, 8 * U, 0, 0, Math.PI * 2); ctx.fill();
  // l'héroïne (clignote si touchée)
  const blink = S.hero.hurt > 0 && Math.floor(t * 16) % 2 === 0;
  const tilt = (S.hero.tx - S.hero.x) / W * 0.6;
  const bob = Math.sin(t * 10) * 2 * U * Math.min(1, Math.abs(S.hero.tx - S.hero.x) / 20);
  drawImg(IMG.heroine, x, yc + bob, hh, tilt, blink ? 0.35 : 1);
  if (P.geante > 0) { // étoiles autour quand elle est géante
    ctx.fillStyle = "#ff4f7b";
    for (let k = 0; k < 5; k++) {
      const a = t * 2 + k * 1.256;
      star(x + Math.cos(a) * hh * 0.5, yc + Math.sin(a) * hh * 0.5, 9 * U);
    }
  }
  if (P.bouclier > 0) {
    ctx.save();
    const r = hh * 0.62;
    const g = ctx.createRadialGradient(x, yc, r * 0.6, x, yc, r);
    g.addColorStop(0, "rgba(255,143,208,0.05)"); g.addColorStop(1, "rgba(255,143,208,0.45)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, yc, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255," + (0.6 + 0.3 * Math.sin(t * 6)) + ")";
    ctx.lineWidth = 5 * U; ctx.stroke();
    ctx.restore();
  }
}

function drawHUD(t) {
  // vies
  for (let i = 0; i < VIES; i++) heart(28 * U + i * 36 * U, 32 * U, 1.35 * U, i < S.lives);
  // score avec une pièce
  const sx = W - 20 * U;
  ctx.font = "bold " + Math.round(40 * U) + "px Chalkboard SE, Comic Sans MS, sans-serif";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.lineWidth = 6 * U; ctx.strokeStyle = "#fff"; ctx.strokeText(S.score, sx, 34 * U);
  ctx.fillStyle = S.powers.double > 0 ? "#ff9f1a" : "#7a4ccf"; ctx.fillText(S.score, sx, 34 * U);
  const tw = ctx.measureText(String(S.score)).width;
  drawImg(IMG.piece_or, sx - tw - 34 * U, 34 * U, 34 * U);
  if (S.powers.double > 0) {
    ctx.font = "bold " + Math.round(26 * U) + "px Chalkboard SE, Comic Sans MS, sans-serif";
    ctx.fillStyle = "#ff9f1a"; ctx.strokeText("x2", sx - tw - 62 * U, 34 * U); ctx.fillText("x2", sx - tw - 62 * U, 34 * U);
  }
  // meilleur score
  ctx.font = "bold " + Math.round(18 * U) + "px Chalkboard SE, Comic Sans MS, sans-serif";
  ctx.lineWidth = 4 * U;
  const bt = "🏆 " + Math.max(getBest(S.player), S.score);
  ctx.strokeText(bt, sx, 66 * U); ctx.fillStyle = "#7a4ccf"; ctx.fillText(bt, sx, 66 * U);

  // pouvoirs actifs : icône + barre qui se vide
  let i = 0;
  for (const k in S.powers) {
    const info = POWER_INFO[k]; if (!info) continue;
    const x = 30 * U + i * 70 * U, y = 86 * U;
    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.beginPath(); ctx.arc(x, y, 28 * U, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = info.color; ctx.lineWidth = 6 * U;
    ctx.beginPath(); ctx.arc(x, y, 28 * U, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (S.powers[k] / DUREE_POUVOIR)); ctx.stroke();
    drawImg(IMG[info.icon], x, y, 38 * U, Math.sin(t * 4) * 0.15);
    i++;
  }
}

function render(t) {
  ctx.save();
  if (S.shake > 0) ctx.translate((Math.random() - 0.5) * 14 * U * S.shake, (Math.random() - 0.5) * 14 * U * S.shake);
  drawBackground(lastDt);
  if (S.powers.ralenti > 0) { // ciel violet tout doux = ralenti
    ctx.fillStyle = "rgba(164,107,255,0.18)"; ctx.fillRect(0, 0, W, H);
  }

  // objets qui tombent
  for (const it of S.items) {
    const wob = Math.sin(it.wob) * 0.12;
    if (S.powers.ralenti > 0 && !it.bounced) { // petites traînées
      drawImg(IMG[it.kind], it.x, it.y - it.size * 0.35, it.size, it.rot + wob, 0.2);
    }
    if (BONBONS.includes(it.kind)) { // les bonbons brillent
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      star(it.x + it.size * 0.45, it.y - it.size * 0.4, (6 + 3 * Math.sin(t * 8 + it.wob)) * U);
    }
    drawImg(IMG[it.kind], it.x, it.y, it.size, it.rot + wob);
  }

  if (S.running) drawHero(t);

  // particules
  for (const p of S.parts) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.color;
    if (p.star) star(p.x, p.y, p.r * 1.6);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const tx of S.texts) {
    ctx.globalAlpha = Math.max(0, 1 - tx.t);
    ctx.font = "bold " + Math.round(34 * U) + "px Chalkboard SE, Comic Sans MS, sans-serif";
    ctx.lineWidth = 5 * U; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.strokeText(tx.txt, tx.x, tx.y);
    ctx.fillStyle = tx.color; ctx.fillText(tx.txt, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
  if (S.flash) { ctx.fillStyle = S.flash.color; ctx.globalAlpha = S.flash.t * 0.5; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  ctx.restore();
  if (S.running) drawHUD(t);
}

// ---------- Boucle ----------
let last = performance.now(), lastDt = 0;
function loop(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.paused) dt = 0;
  lastDt = dt;
  if (S.running && !S.paused) update(dt);
  else if (!S.running) { // dans le menu : quelques objets tombent pour décorer
    S.spawnT -= dt;
    if (loaded === names.length && S.spawnT <= 0 && S.items.length < 8) { S.time = 30; spawn(); S.spawnT = 0.9; }
    for (let i = S.items.length - 1; i >= 0; i--) {
      const it = S.items[i];
      if (it.bounced) { it.vy += 1400 * U * dt; it.x += it.vx * dt; it.y += it.vy * dt; }
      else it.y += 90 * U * dt;
      it.wob += dt * 3;
      if (it.y - it.size > H) S.items.splice(i, 1);
    }
    for (let i = S.parts.length - 1; i >= 0; i--) { const p = S.parts[i]; p.t += dt; p.vy += 500 * U * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t > p.life) S.parts.splice(i, 1); }
    S.texts = [];
  }
  render(now / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- Contrôles ----------
function pointerX(e) { return e.clientX; }
cv.addEventListener("pointerdown", e => { if (S.running && !S.paused) S.hero.tx = pointerX(e); });
cv.addEventListener("pointermove", e => {
  if (!S.running || S.paused) return;
  // doigt : on suit le doigt ; souris : on suit la souris même sans cliquer
  if (e.pointerType === "mouse" || e.buttons || e.pressure > 0) S.hero.tx = pointerX(e);
});
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "q") { keys.left = true; e.preventDefault(); }
  if (e.key === "ArrowRight" || e.key === "d") { keys.right = true; e.preventDefault(); }
  if ((e.key === " " || e.key === "Enter") && !S.running && document.getElementById("over").classList.contains("show")) startGame(S.player);
  if (e.key === "Escape" || e.key === "p") togglePause();
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "q") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
});
document.addEventListener("contextmenu", e => e.preventDefault());

function togglePause() {
  if (!S.running) return;
  S.paused = !S.paused;
  show(S.paused ? "pause" : null);
  document.getElementById("pauseBtn").classList.toggle("show", !S.paused);
}
document.addEventListener("visibilitychange", () => { if (document.hidden && S.running && !S.paused) togglePause(); });

document.querySelectorAll(".player").forEach(b => b.addEventListener("click", () => { sfx.click(); startGame(+b.dataset.p); }));
document.getElementById("againBtn").addEventListener("click", () => { sfx.click(); startGame(S.player); });
document.getElementById("homeBtn").addEventListener("click", () => { sfx.click(); refreshMenu(); S.items = []; show("menu"); });
document.getElementById("pauseBtn").addEventListener("click", togglePause);
document.getElementById("resumeBtn").addEventListener("click", togglePause);
document.getElementById("quitBtn").addEventListener("click", () => { S.paused = false; S.running = false; S.items = []; S.powers = {}; refreshMenu(); show("menu"); });
</script>
</body>
